<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MTN Cameroun - Notification</title>
  <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/d/dd/MTN_logo.png" type="image/png" />
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background-color: #fff200;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    .container {
      background-color: #fff;
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
      max-width: 500px;
      width: 90%;
    }

    .container img {
      width: 80px;
      margin-bottom: 20px;
    }

    .message {
      font-size: 1.3rem;
      color: #333;
      margin-bottom: 30px;
    }

    .btn {
      background-color: #ffcb05;
      color: #000;
      text-decoration: none;
      padding: 12px 25px;
      border-radius: 6px;
      font-weight: bold;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.1);
      transition: background-color 0.3s ease;
    }

    .btn:hover {
      background-color: #ffe95d;
    }

    @media (max-width: 480px) {
      .message {
        font-size: 1.1rem;
      }

      .btn {
        width: 100%;
        display: block;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="https://upload.wikimedia.org/wikipedia/commons/d/dd/MTN_logo.png" alt="MTN Logo" />
    <div class="message">{{ message }}</div>
    <a href="/" class="btn">Retour au pointage</a>
  </div>
</body>
</html>
